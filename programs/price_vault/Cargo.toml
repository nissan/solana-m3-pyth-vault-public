[package]
name = "price_vault"
version = "0.1.0"
description = "Price-settled vault program for The Solana Deeds #8: up or down positions settled from a Pyth price"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "price_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.2"
pyth-solana-receiver-sdk = "=2.0.0"

[dev-dependencies]
litesvm = "=0.18.2"
solana-account = "4.3.0"
solana-clock = "3.2.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
